<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Peta Hotspot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:sans-serif;}
body{display:flex;flex-direction:column;}

.header{
display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;
padding:6px 10px;
background:#444;
color:white;
height:60px;
}

.logo{height:36px;}

.title{
text-align:center;
font-size:13px;
font-weight:bold;
}

.main{
flex:1;
position:relative;
}

#map{
width:100%;
height:100%;
}

.filters{
position:absolute;
top:50%;
left:10px;
transform:translateY(-50%);
background:white;
padding:10px;
border-radius:6px;
font-size:13px;
z-index:999;
max-width:90vw;
box-shadow:0 1px 6px rgba(0,0,0,0.2);
}

.filters h4{
margin:10px 0 6px;
font-size:14px;
}

.filters label{
display:block;
margin-bottom:4px;
}

.export-button{
padding:6px 10px;
background:#444;
color:white;
border:none;
border-radius:4px;
font-size:12px;
cursor:pointer;
width:100%;
margin-bottom:6px;
}

#login-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10000;
}

#login-overlay input{
padding:10px;
font-size:16px;
border-radius:6px;
border:none;
margin-top:10px;
}

#login-overlay button{
margin-top:12px;
padding:8px 16px;
font-size:14px;
background:#444;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

#login-error{
color:red;
margin-top:10px;
display:none;
}
</style>
</head>

<body>

<div id="login-overlay">
<h2>Masukkan Password</h2>
<input id="password-input" type="password" placeholder="Password"/>
<button onclick="checkPassword()">Masuk</button>
<div id="login-error">Password salah</div>
</div>

<div class="header">
<img src="logo-kiri.png" class="logo">
<div class="title">
DIREKTORAT PENGENDALIAN KEBAKARAN LAHAN<br>
<small>Peta Hotspot Level Confidence Medium - High selama 3 hari</small>
</div>
<img src="logo-kanan.png" class="logo">
</div>

<div class="main">

<div class="filters">

<h4>Confidence</h4>
<label><input type="checkbox" class="confidence-filter" value="medium" checked> Medium</label>
<label><input type="checkbox" class="confidence-filter" value="high" checked> High</label>

<h4>Tanggal</h4>
<div id="tanggal-filter"></div>

<h4>Sumber</h4>
<div id="sumber-filter"></div>

<h4>Layer</h4>
<label><input type="checkbox" id="pbph-toggle"> PBPH</label>
<label><input type="checkbox" id="kebun-toggle"> Kebun</label>
<label><input type="checkbox" id="gambut-toggle"> Gambut</label>

<h4>Download</h4>

<button class="export-button" onclick="exportHotspotPerusahaan()">Analisis Hotspot Perusahaan</button>
<button class="export-button" onclick="cetakPDFPerusahaan()">Cetak PDF Perusahaan</button>

</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-pip@latest/leaflet-pip.min.js"></script>

<script>

const map = L.map('map',{attributionControl:false}).setView([-2.5,117],5);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:18}
).addTo(map);

const hotspotLayer = L.layerGroup().addTo(map);

let pbphLayer=null;
let kebunLayer=null;
let gambutLayer=null;

let rawData=[];

let hasilPerusahaan={};
let totalHotspotAnalisis=0;

const url="https://opensheet.elk.sh/1Vce5YUId7cUZ29j8OEhdFSer26cszXgX3OSm5zoX1UI/Data%20Hotspot%20Nasional";

async function loadGeoJSON(file,style){

const r = await fetch(file);
const g = await r.json();

return L.geoJSON(g,{
style:style,
onEachFeature:(f,l)=>{

let html='';

for(let k in f.properties){
html+=`<b>${k}</b>: ${f.properties[k]}<br>`;
}

l.bindPopup(html);

}
});

}

function parseTanggal(text){

if(!text) return "";

const d=new Date(text);

if(isNaN(d)) return "";

return d.toLocaleDateString('id-ID',{
day:'2-digit',
month:'long',
year:'numeric'
});

}

function renderFilterTanggal(){

const div=document.getElementById("tanggal-filter");

div.innerHTML="";

const dates=[...new Set(rawData.map(r=>parseTanggal(r["Tanggal & Jam"])))];

dates.sort().reverse();

dates.forEach(d=>{
div.innerHTML+=`<label><input type="checkbox" class="tanggal-filter" value="${d}" checked> ${d}</label>`;
});

}

function renderFilterSumber(){

const div=document.getElementById("sumber-filter");

div.innerHTML="";

const set=new Set(rawData.map(r=>r.Sumber).filter(Boolean));

[...set].sort().forEach(s=>{
div.innerHTML+=`<label><input type="checkbox" class="sumber-filter" value="${s}" checked> ${s}</label>`;
});

}

function getSelectedFilters(){

return{

levels:[...document.querySelectorAll('.confidence-filter:checked')].map(x=>x.value),

tanggal:[...document.querySelectorAll('.tanggal-filter:checked')].map(x=>x.value),

sumber:[...document.querySelectorAll('.sumber-filter:checked')].map(x=>x.value)

};

}

function applyFilters(){

if(!rawData.length) return;

const f=getSelectedFilters();

hotspotLayer.clearLayers();

rawData.forEach(r=>{

const lat=parseFloat(r.Latitude);
const lon=parseFloat(r.Longitude);

if(isNaN(lat)||isNaN(lon)) return;

const conf=r.Confidence_Level?.toLowerCase();
const t=parseTanggal(r["Tanggal & Jam"]);
const s=r.Sumber;

if(!f.levels.includes(conf)) return;
if(!f.tanggal.includes(t)) return;
if(!f.sumber.includes(s)) return;

L.circleMarker([lat,lon],{
radius:6,
fillColor:conf==='high'?'red':'yellow',
color:"#000",
weight:1,
fillOpacity:0.7
})
.addTo(hotspotLayer)
.bindPopup(`
<b>${r["Tanggal & Jam"]}</b><br>
${r.Provinsi}<br>
Confidence: ${conf}<br>
<a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">Google Maps</a>
`);

});

}

async function fetchHotspot(){

const r=await fetch(url);

rawData=await r.json();

renderFilterTanggal();
renderFilterSumber();
applyFilters();

document.querySelectorAll(".filters input")
.forEach(e=>e.addEventListener("change",applyFilters));

}

async function loadLayers(){

pbphLayer = await loadGeoJSON('PBPH.geojson',{color:"blue",weight:1});
kebunLayer = await loadGeoJSON('kebun.geojson',{color:"green",weight:2,fillOpacity:0.1});
gambutLayer = await loadGeoJSON('gambut.geojson',{color:"brown",weight:2,fillOpacity:0.1});

}

document.getElementById("pbph-toggle").onchange=e=>{
if(pbphLayer){
e.target.checked?pbphLayer.addTo(map):map.removeLayer(pbphLayer);
}
};

document.getElementById("kebun-toggle").onchange=e=>{
if(kebunLayer){
e.target.checked?kebunLayer.addTo(map):map.removeLayer(kebunLayer);
}
};

document.getElementById("gambut-toggle").onchange=e=>{
if(gambutLayer){
e.target.checked?gambutLayer.addTo(map):map.removeLayer(gambutLayer);
}
};

function exportHotspotPerusahaan(){

hasilPerusahaan={};
totalHotspotAnalisis=0;

const f=getSelectedFilters();

rawData.forEach(r=>{

const lat=parseFloat(r.Latitude);
const lon=parseFloat(r.Longitude);

if(isNaN(lat)||isNaN(lon)) return;

const conf=r.Confidence_Level?.toLowerCase();
const t=parseTanggal(r["Tanggal & Jam"]);
const s=r.Sumber;

if(!f.levels.includes(conf)) return;
if(!f.tanggal.includes(t)) return;
if(!f.sumber.includes(s)) return;

const point=[lon,lat];

function cekLayer(layer){

layer.eachLayer(poly=>{

const inside = leafletPip.pointInLayer(point,layer,true);

if(inside.length){

let nama =
poly.feature.properties.NAMA ||
poly.feature.properties.NAMA_PERUSAHAAN ||
poly.feature.properties.PERUSAHAAN ||
"Tidak diketahui";

if(!hasilPerusahaan[nama]){
hasilPerusahaan[nama]=0;
}

hasilPerusahaan[nama]++;

totalHotspotAnalisis++;

}

});

}

if(pbphLayer && map.hasLayer(pbphLayer)) cekLayer(pbphLayer);
if(kebunLayer && map.hasLayer(kebunLayer)) cekLayer(kebunLayer);
if(gambutLayer && map.hasLayer(gambutLayer)) cekLayer(gambutLayer);

});

alert("Analisis selesai. Klik Cetak PDF.");

}

function cetakPDFPerusahaan(){

if(!Object.keys(hasilPerusahaan).length){

alert("Belum ada hasil analisis");

return;

}

const {jsPDF}=window.jspdf;

const doc=new jsPDF();

const tanggal=new Date().toLocaleDateString("id-ID");

doc.setFontSize(14);
doc.text("LAPORAN ANALISIS HOTSPOT PERUSAHAAN",105,15,{align:"center"});

doc.setFontSize(10);
doc.text("Direktorat Pengendalian Kebakaran Hutan dan Lahan",105,22,{align:"center"});

doc.setFontSize(9);
doc.text("Tanggal Analisis : "+tanggal,14,30);
doc.text("Total Hotspot Teranalisis : "+totalHotspotAnalisis,14,36);

let rows = Object.entries(hasilPerusahaan)
.map(([nama,jumlah])=>({nama,jumlah}))
.sort((a,b)=>b.jumlah-a.jumlah)
.map((r,i)=>[
i+1,
r.nama,
r.jumlah
]);

doc.autoTable({

startY:42,

head:[["No","Nama Perusahaan","Jumlah Hotspot"]],

body:rows,

styles:{fontSize:8},

headStyles:{fillColor:[60,60,60]}

});

doc.save("laporan_hotspot_perusahaan.pdf");

}

function checkPassword(){

const pw=document.getElementById("password-input").value;

if(pw==="karla"){

localStorage.setItem("hotspot_logged_in","true");

document.getElementById("login-overlay").style.display="none";

init();

}else{

document.getElementById("login-error").style.display="block";

}

}

async function init(){

await loadLayers();

await fetchHotspot();

}

window.onload=()=>{

if(localStorage.getItem("hotspot_logged_in")==="true"){

document.getElementById("login-overlay").style.display="none";

init();

}

};

</script>

</body>
</html>
